<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll Management System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="portal-page">
    <div class="portal-login" id="mainLoginBox">
        <h1>Payroll System</h1>
        <p class="subtitle">Employee Payroll Management System</p>

        <!-- Role Switcher Tabs -->
        <div class="login-tabs">
            <button type="button" class="login-tab-btn active" id="adminTabBtn" onclick="switchLoginTab('admin')">Admin Login</button>
            <button type="button" class="login-tab-btn" id="employeeTabBtn" onclick="switchLoginTab('employee')">Employee Login</button>
        </div>

        <!-- Admin Login Form -->
        <div class="login-pane active" id="adminPane">
            <form onsubmit="adminLogin(event)">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter admin username" required autocomplete="username">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">

                <button type="submit" class="primary-btn" id="adminSubmitBtn">Login as Admin</button>
                <p id="loginMessage"></p>
            </form>

            <div class="demo-hint">
                <strong>Admin Credentials:</strong><br>
                Username: <code>admin</code> | Password: <code>admin123</code>
            </div>
        </div>

        <!-- Employee Login Form -->
        <div class="login-pane" id="employeePane">
            <form onsubmit="employeeWebLogin(event)">
                <label for="portalEmployeeId">Employee ID</label>
                <input type="number" id="portalEmployeeId" min="1" step="1" placeholder="Enter Employee ID (e.g. 101)" required>

                <label for="portalPassword">Password</label>
                <input type="password" id="portalPassword" placeholder="Enter password" required autocomplete="current-password">

                <button type="submit" class="primary-btn" id="employeeSubmitBtn">Login to Employee Portal</button>
                <p id="portalMessage" role="alert" aria-live="polite"></p>
            </form>

            <div class="demo-hint">
                <strong>Employee Credentials:</strong><br>
                Format: <code>&lt;ID&gt;@123</code> (e.g. ID: <code>101</code>, Pass: <code>101@123</code>)
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
