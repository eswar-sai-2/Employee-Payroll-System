<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
<aside class="sidebar">
  <h2>Payroll System</h2>
  <ul>
    <li onclick="goTo('dashboard.html')">Dashboard</li>
    <li class="selected">Employees</li>
    <li onclick="goTo('payroll.html')">Payroll</li>
    <li onclick="goTo('portal.html')">Employee Portal</li>
    <li onclick="logout()">Logout</li>
  </ul>
</aside>
<main class="main-content">
  <header class="page-header">
    <div><h1>Employee Management</h1><p>Manage employee records and salary details</p></div>
    <button class="primary-btn" onclick="openEmployeeForm()">+ Add Employee</button>
  </header>

  <section class="employee-controls">
    <input type="text" id="searchEmployee" placeholder="Search by ID, name or department..." onkeyup="searchEmployees()">
  </section>

  <section class="employee-form" id="employeeForm">
    <h2 id="formTitle">Add Employee</h2>
    <form onsubmit="saveEmployee(event)">
      <div class="form-grid">
        <div><label>Employee ID</label><input type="number" id="employeeId" min="1" required></div>
        <div><label>Employee Name</label><input type="text" id="employeeName" required></div>
        <div><label>Department</label><input type="text" id="department" required></div>
        <div><label>Basic Salary</label><input type="number" id="basicSalary" min="0" step="0.01" required></div>
        <div><label>Allowances</label><input type="number" id="allowances" min="0" step="0.01" required></div>
        <div><label>Deductions</label><input type="number" id="deductions" min="0" step="0.01" required></div>
      </div>
      <div class="form-buttons">
        <button type="submit" class="primary-btn" id="saveEmployeeBtn">Add Employee</button>
        <button type="button" class="cancel-btn" onclick="closeEmployeeForm()">Cancel</button>
      </div>
    </form>
  </section>

  <section class="table-container">
    <h2>Employee Records</h2>
    <table>
      <thead><tr>
        <th>ID</th><th>Name</th><th>Department</th><th>Basic Salary</th>
        <th>Allowances</th><th>Deductions</th><th>Gross Salary</th><th>Net Salary</th><th>Actions</th>
      </tr></thead>
      <tbody id="employeeTableBody"></tbody>
    </table>
  </section>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
